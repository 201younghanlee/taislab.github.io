evidence:
  - Across 11 independently taught course sections audited from 2024 to 2026, final course-evaluation averages ranged from 4.41 to 4.88 out of 5, based on 373 responses, with a response-weighted mean of 4.60.
  - In Spring 2026, Artificial Intelligence Basics received 4.60 out of 5 in the final evaluation with 95 of 100 students responding. Python Programming sections received 4.57 and 4.77 out of 5.
  - Teaching combines conceptual foundations with coding, practical attack-and-defence exercises, research papers, presentations, and projects. Formal CQI feedback is used to improve pacing, materials, practical work, and explanation of technical terminology.

