name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.jsonc"
      - "**/*.scss"
      - "**.liquid"
      - "**/*.md"
      - "**/*.txt"
      - "llms.txt"
      - "**/*.bib"
      - "**/*.rb"
      - "**.yml"
      - "CNAME"
      - "Gemfile*"
      - "package*.json"
      - "robots.txt"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.jsonc"
      - "**/*.scss"
      - "**.liquid"
      - "**/*.md"
      - "**/*.txt"
      - "llms.txt"
      - "**/*.bib"
      - "**/*.rb"
      - "**.yml"
      - "CNAME"
      - "Gemfile*"
      - "package*.json"
      - "robots.txt"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Internal TAIS Lab links are validated against the freshly built site in
          # tests/test_agent_readiness.py and broken-links-site.yml. Excluding the
          # live domain here prevents a race with GitHub Pages publication.
          args: >-
            --exclude-path README.md
            --exclude-path CUSTOMIZE.md
            --exclude-path _pages/404.md
            --exclude '^https://www\.taislab\.co\.kr/'
            --verbose
            --no-progress
            './**/*.md'
            './**/*.html'
            './llms.txt'
