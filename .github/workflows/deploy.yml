name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.jsonc"
      - "**/*.scss"
      - "**.liquid"
      - "**/*.md"
      - "**/*.txt"
      - "llms.txt"
      - "**/*.bib"
      - "**/*.rb"
      - "**.yml"
      - "CNAME"
      - "Gemfile*"
      - "package*.json"
      - "robots.txt"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.mjs"
      - "**/*.py"
      - "**/*.jsonc"
      - "**/*.scss"
      - "**.liquid"
      - "**/*.md"
      - "**/*.txt"
      - "llms.txt"
      - "**/*.bib"
      - "**/*.rb"
      - "**.yml"
      - "CNAME"
      - "Gemfile*"
      - "package*.json"
      - "robots.txt"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
          python3 scripts/generate_agent_markdown.py --site-dir _site --base-url https://www.taislab.co.kr
          python3 -m unittest discover -s tests -p "test_*.py"
          node --test edge/worker.test.mjs
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      - name: Preserve prebuilt output on GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.nojekyll?ref=gh-pages" >/dev/null 2>&1; then
            echo ".nojekyll is present on gh-pages"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.nojekyll" \
              -f message="Serve generated site without a second Jekyll build" \
              -f content="" \
              -f branch="gh-pages"
          fi
